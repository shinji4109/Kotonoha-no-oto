<style>
:root {
  --bg: #E9ECF2;
  --ink: #121828;
  --ink-2: rgba(18, 24, 40, 0.62);
  --line: rgba(18, 24, 40, 0.13);
  --line-strong: rgba(18, 24, 40, 0.24);
  --hover: rgba(18, 24, 40, 0.05);
  --chip: rgba(255, 255, 255, 0.4);
  --lift: rgba(250, 251, 253, 0.96);
  --amb-filter: blur(56px) saturate(1.45) brightness(1.2);
  --amb-opacity: 0.6;
  --veil: linear-gradient(to bottom, rgba(233, 236, 242, 0.25) 0%, rgba(233, 236, 242, 0.7) 55%, rgba(233, 236, 242, 0.92) 100%);
  --art-shadow: 0 28px 56px -24px rgba(18, 24, 40, 0.55);
  --btn-bg: #121828;
  --btn-ink: #FFFFFF;
  --accent-l: #2A4E9C;
  --accent-d: #A9BEF0;
  --accent: var(--accent-l);
  --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1020;
    --ink: #F2F4F8;
    --ink-2: rgba(242, 244, 248, 0.6);
    --line: rgba(242, 244, 248, 0.12);
    --line-strong: rgba(242, 244, 248, 0.24);
    --hover: rgba(242, 244, 248, 0.06);
    --chip: rgba(255, 255, 255, 0.06);
    --lift: rgba(24, 31, 54, 0.97);
    --amb-filter: blur(56px) saturate(1.3) brightness(0.62);
    --amb-opacity: 0.95;
    --veil: linear-gradient(to bottom, rgba(11, 16, 32, 0.15) 0%, rgba(11, 16, 32, 0.6) 55%, rgba(11, 16, 32, 0.9) 100%);
    --art-shadow: 0 30px 60px -22px rgba(0, 0, 0, 0.75);
    --btn-bg: rgba(255, 255, 255, 0.94);
    --btn-ink: #0B1020;
    --accent: var(--accent-d);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1020;
  --ink: #F2F4F8;
  --ink-2: rgba(242, 244, 248, 0.6);
  --line: rgba(242, 244, 248, 0.12);
  --line-strong: rgba(242, 244, 248, 0.24);
  --hover: rgba(242, 244, 248, 0.06);
  --chip: rgba(255, 255, 255, 0.06);
  --lift: rgba(24, 31, 54, 0.97);
  --amb-filter: blur(56px) saturate(1.3) brightness(0.62);
  --amb-opacity: 0.95;
  --veil: linear-gradient(to bottom, rgba(11, 16, 32, 0.15) 0%, rgba(11, 16, 32, 0.6) 55%, rgba(11, 16, 32, 0.9) 100%);
  --art-shadow: 0 30px 60px -22px rgba(0, 0, 0, 0.75);
  --btn-bg: rgba(255, 255, 255, 0.94);
  --btn-ink: #0B1020;
  --accent: var(--accent-d);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }

.amb { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.amb-img {
  position: absolute;
  inset: -20%;
  background-size: cover;
  background-position: center;
  filter: var(--amb-filter);
  opacity: 0;
  transition: opacity 1.4s ease;
  will-change: opacity;
}
.amb-img.on { opacity: var(--amb-opacity); }
.veil { position: absolute; inset: 0; background: var(--veil); }

.wrap {
  position: relative;
  z-index: 1;
  max-width: 28rem;
  margin: 0 auto;
  padding: 1.75rem 1.5rem 3.5rem;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1.1rem;
  align-items: start;
}
.art {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: var(--art-shadow);
  transform: scale(0.94);
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}
body.playing .art { transform: scale(1); }
.art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.art img.on { opacity: 1; }
.vt { writing-mode: vertical-rl; padding-top: 0.25rem; }
.vt h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(1.7rem, 7.6vw, 2.2rem);
  line-height: 1.15;
  letter-spacing: 0.42em;
}
.vt p {
  margin: 0;
  margin-block-start: 0.6rem;
  padding-block-start: 0.6rem;
  border-block-start: 1px solid var(--line);
  font-size: 0.72rem;
  letter-spacing: 0.34em;
  color: var(--ink-2);
}

.meta { margin-top: 2.1rem; }
.song {
  margin: 0;
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(1.5rem, 6.6vw, 2rem);
  line-height: 1.35;
  letter-spacing: 0.06em;
  text-wrap: balance;
  transition: opacity 0.4s ease;
}
.song.fade { opacity: 0; }
.by { margin: 0.3rem 0 0; font-size: 0.85rem; letter-spacing: 0.08em; color: var(--ink-2); }

.seek { margin-top: 1.6rem; }
.seek input[type="range"] {
  --p: 0%;
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.seek input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--ink) var(--p), var(--line) var(--p));
}
.seek input[type="range"]::-moz-range-track {
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--ink) var(--p), var(--line) var(--p));
}
.seek input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--ink);
  border: none;
}
.seek input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--ink);
  border: none;
}
.times {
  display: flex;
  justify-content: space-between;
  font-size: 0.72rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 21rem;
  margin: 1rem auto 0;
}
.controls button {
  position: relative;
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.controls svg { width: 26px; height: 26px; fill: currentColor; }
.controls .sm { width: 44px; height: 44px; color: var(--ink-2); }
.controls .sm svg { width: 21px; height: 21px; }
.controls .sm[aria-pressed="true"] { color: var(--accent); }
.controls .sm[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  bottom: 3px;
  left: 50%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: currentColor;
}
.controls .play {
  width: 72px;
  height: 72px;
  background: var(--btn-bg);
  color: var(--btn-ink);
  box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.5);
  transition: transform 0.15s ease;
}
.controls .play svg { width: 30px; height: 30px; }
.controls .play:active { transform: scale(0.95); }
.status {
  min-height: 1.4rem;
  margin: 0.6rem 0 0;
  text-align: center;
  font-size: 0.8rem;
  color: var(--ink-2);
}

.offline {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  margin-top: 0.6rem;
}
.save {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1.15rem;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--chip);
  color: var(--ink);
  font: 500 0.82rem/1 var(--sans);
  letter-spacing: 0.06em;
  cursor: pointer;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.save svg { width: 17px; height: 17px; fill: currentColor; }
.save[data-state="done"] { color: var(--accent); border-color: var(--line); cursor: default; }
.save:disabled { opacity: 0.75; }
.unsave {
  padding: 0.25rem 0.5rem;
  border: none;
  background: none;
  color: var(--ink-2);
  font: 400 0.72rem var(--sans);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.hint { margin: 0; font-size: 0.72rem; color: var(--ink-2); text-align: center; }

.tanka { display: flex; justify-content: center; margin-top: 2.4rem; }
.tanka-body {
  margin: 0;
  writing-mode: vertical-rl;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.05rem;
  line-height: 2.1;
  letter-spacing: 0.2em;
}
.tanka-body span { display: block; }
.tanka-body small {
  display: block;
  margin-block-start: 1rem;
  font-family: var(--sans);
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--ink-2);
}

.listhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2.4rem;
  padding: 0 0 0.5rem 0.25rem;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--ink-2);
}
.listhead .sum span + span { margin-left: 1rem; }
.edit {
  padding: 0.4rem 0.75rem;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: 500 0.8rem/1 var(--sans);
  letter-spacing: 0.08em;
  cursor: pointer;
}
.edit[aria-pressed="true"] { color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; }
.list li {
  position: relative;
  display: flex;
  align-items: center;
  border-top: 1px solid var(--line);
  transition: transform 0.18s ease;
}
.list li:last-child { border-bottom: 1px solid var(--line); }
.list li.lift {
  z-index: 2;
  transition: none;
  border-radius: 6px;
  border-color: transparent;
  background: var(--lift);
  box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.45);
}
.row {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  gap: 0.9rem;
  align-items: center;
  padding: 0.8rem 0.25rem;
  border: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.row img { display: block; width: 48px; height: 48px; border-radius: 4px; object-fit: cover; }
.row .t {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1rem;
  line-height: 1.45;
  letter-spacing: 0.04em;
}
.row .mid { display: flex; align-items: center; min-width: 0; }
.row .mid .eq { flex-shrink: 0; }
.row .d {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.72rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.row .d svg { display: none; width: 14px; height: 14px; fill: currentColor; }
li.is-saved .row .d svg { display: block; }
.row[aria-current="true"] .t { font-weight: 700; color: var(--accent); }
.eq { display: none; }
body.playing .row[aria-current="true"] .eq {
  display: inline-flex;
  gap: 2px;
  align-items: flex-end;
  height: 11px;
  margin-left: 0.55rem;
  vertical-align: -1px;
}
.eq i {
  width: 2px;
  height: 100%;
  background: var(--accent);
  transform-origin: bottom;
  animation: bar 0.9s ease-in-out infinite;
}
.eq i:nth-child(2) { animation-delay: -0.3s; }
.eq i:nth-child(3) { animation-delay: -0.6s; }
@keyframes bar { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
.handle {
  display: none;
  place-items: center;
  width: 48px;
  height: 48px;
  margin-right: 0.1rem;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  cursor: grab;
  touch-action: none;
}
.handle svg { width: 22px; height: 22px; fill: currentColor; }
body.editing .handle { display: grid; }
body.editing .row { cursor: default; }
body.editing .row .d { display: none; }

@media (hover: hover) {
  .controls button:not(.play):hover { background: var(--hover); }
  .row:hover, .edit:hover { background: var(--hover); }
  body.editing .row:hover { background: transparent; }
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .amb-img, .art, .art img, .song, .controls .play, .list li { transition: none; }
  .eq i { animation: none; transform: scaleY(0.8); }
}
</style>
</head>
<body>
<div class="amb" aria-hidden="true">
  <div class="amb-img" id="ambA"></div>
  <div class="amb-img" id="ambB"></div>
  <div class="veil"></div>
</div>

<main class="wrap">
  <section class="hero">
    <div class="art" aria-hidden="true">
      <img id="artA" alt="">
      <img id="artB" alt="">
    </div>
    <div class="vt">
      <h1>言の葉の音</h1>
      <p>こと乃葉しんじ</p>
    </div>
  </section>

  <section class="meta" aria-label="再生中の曲">
    <h2 class="song" id="songTitle"></h2>
    <p class="by" id="songArtist"></p>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="再生位置">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button id="shuffle" class="sm" type="button" aria-label="シャッフル再生" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button id="prev" type="button" aria-label="前の曲">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.5v13a.5.5 0 0 1-.77.42L9.5 12.42a.5.5 0 0 1 0-.84l9.73-6.5A.5.5 0 0 1 20 5.5z"/></svg>
      </button>
      <button id="play" class="play" type="button" aria-label="再生">
        <svg id="icPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a.6.6 0 0 0 .92.5l10.6-6.86a.6.6 0 0 0 0-1l-10.6-6.86A.6.6 0 0 0 8 5.14z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button id="next" type="button" aria-label="次の曲">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.5v13a.5.5 0 0 0 .77.42l9.73-6.5a.5.5 0 0 0 0-.84L4.77 5.08A.5.5 0 0 0 4 5.5z"/></svg>
      </button>
      <button id="repeat" class="sm" type="button" aria-label="全曲リピート" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="offline" id="offline">
      <button id="saveBtn" class="save" type="button" data-state="idle">
        <svg id="icSave" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <svg id="icDone" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span id="saveLabel">オフライン保存</span>
      </button>
      <button id="unsave" class="unsave" type="button" hidden>保存した曲を削除</button>
      <p class="hint" id="hint" hidden>ホーム画面に追加すると、電波がなくても開けます</p>
    </div>
  </section>

  <section class="tanka" id="tanka" aria-label="原点の短歌" hidden>
    <p class="tanka-body" id="tankaBody"></p>
  </section>

  <div class="listhead">
    <span class="sum" id="sum"></span>
    <button id="editBtn" class="edit" type="button" aria-pressed="false">並べ替え</button>
  </div>
  <ol class="list" id="tracks" aria-label="曲目"></ol>
</main>

<script>
(() => {
  "use strict";
  const ARTIST = "こと乃葉しんじ";
  const ALBUM = "言の葉の音";
  const SONG_CACHE = "kn-songs-v1";
  const STATE_KEY = "kn-player-v1";
  const K = ["5gMBwL55UA=", "GDlCY7BPYbQ", "/Nw42z5haZA", "I0Rln9vNQOU"];
  // tanka：原点の短歌を句の区切りごとに配列で入れると、縦書きで表示されます（空なら非表示）
  const TRACKS = [
    { id: "nagi", title: "凪", file: "nagi.bin", art: "nagi.jpg", accentL: "#2A4E9C", accentD: "#A9BEF0", length: 259.88, tanka: [] },
    { id: "jounetsu", title: "この情熱が　僕の声になる", file: "jounetsu.bin", art: "jounetsu.jpg", accentL: "#A7362F", accentD: "#F0A898", length: 289.56, tanka: [] }
  ];

  const $ = (id) => document.getElementById(id);
  const audio = new Audio();
  audio.preload = "auto";
  const seek = $("seek"), curEl = $("cur"), durEl = $("dur"), statusEl = $("status");
  const playBtn = $("play"), icPlay = $("icPlay"), icPause = $("icPause");
  const list = $("tracks"), songEl = $("songTitle");
  const shuffleBtn = $("shuffle"), repeatBtn = $("repeat"), editBtn = $("editBtn");
  const saveBtn = $("saveBtn"), saveLabel = $("saveLabel"), unsaveBtn = $("unsave");
  let artFront = $("artA"), artBack = $("artB");
  let ambFront = $("ambA"), ambBack = $("ambB");

  let order = TRACKS.map((_, i) => i);
  let queue = [];
  let pos = 0;
  let cur = 0;
  let shuffle = false;
  let repeat = false;
  let editing = false;
  let seeking = false;
  let loaded = false;
  let wantPlay = false;
  let loadToken = 0;
  let srcId = null;
  let cryptoKey = null;
  let saving = false;
  let saved = new Set();
  const blobs = {};

  /* ---------- 保存された設定 ---------- */
  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
      if (!s) return;
      if (Array.isArray(s.order)) {
        const ids = TRACKS.map((t) => t.id);
        const o = s.order.map((id) => ids.indexOf(id)).filter((i) => i >= 0);
        ids.forEach((_, i) => { if (o.indexOf(i) < 0) o.push(i); });
        order = o;
      }
      shuffle = !!s.shuffle;
      repeat = !!s.repeat;
    } catch (e) {}
  }
  function saveState() {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({ order: order.map((i) => TRACKS[i].id), shuffle, repeat }));
    } catch (e) {}
  }

  /* ---------- 表示の小物 ---------- */
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function setStatus(msg) { statusEl.textContent = msg || ""; }
  function setPlayingUI(on) {
    icPlay.style.display = on ? "none" : "";
    icPause.style.display = on ? "" : "none";
    playBtn.setAttribute("aria-label", on ? "一時停止" : "再生");
    document.body.classList.toggle("playing", on);
  }
  function updateSeek() {
    const d = audio.duration;
    if (!seeking) {
      const p = (isFinite(d) && d > 0) ? audio.currentTime / d : 0;
      seek.value = Math.round(p * 1000);
      curEl.textContent = fmt(audio.currentTime);
    }
    seek.style.setProperty("--p", (seek.value / 10) + "%");
  }
  function swapArt(src) {
    if (artFront.getAttribute("src") === src) return;
    artBack.src = src;
    artBack.classList.add("on");
    artFront.classList.remove("on");
    [artFront, artBack] = [artBack, artFront];
    ambBack.style.backgroundImage = 'url("' + src + '")';
    ambBack.classList.add("on");
    ambFront.classList.remove("on");
    [ambFront, ambBack] = [ambBack, ambFront];
  }
  function setTitle(text) {
    if (!songEl.textContent) { songEl.textContent = text; return; }
    songEl.classList.add("fade");
    setTimeout(() => { songEl.textContent = text; songEl.classList.remove("fade"); }, 200);
  }
  function renderTanka(t) {
    const box = $("tanka"), body = $("tankaBody");
    body.textContent = "";
    if (!t.tanka || !t.tanka.length) { box.hidden = true; return; }
    t.tanka.forEach((line) => {
      const s = document.createElement("span");
      s.textContent = line;
      body.appendChild(s);
    });
    const cap = document.createElement("small");
    cap.textContent = "原点の短歌";
    body.appendChild(cap);
    box.hidden = false;
  }
  function setModeButtons() {
    shuffleBtn.setAttribute("aria-pressed", String(shuffle));
    repeatBtn.setAttribute("aria-pressed", String(repeat));
  }
  function setMediaSession(t) {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title,
        artist: ARTIST,
        album: ALBUM,
        artwork: [{ src: new URL(t.art, location.href).href, sizes: "900x900", type: "image/jpeg" }]
      });
    } catch (e) {}
  }

  /* ---------- 曲の読み込み（暗号を解いて再生） ---------- */
  async function getKey() {
    if (cryptoKey) return cryptoKey;
    if (!window.crypto || !crypto.subtle) throw new Error("nocrypto");
    const raw = Uint8Array.from(atob(K.slice().reverse().join("")), (c) => c.charCodeAt(0));
    cryptoKey = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
    return cryptoKey;
  }
  async function getEncrypted(file) {
    if ("caches" in window) {
      try {
        const hit = await caches.match(file);
        if (hit) return await hit.arrayBuffer();
      } catch (e) {}
    }
    const res = await fetch(file);
    if (!res.ok) throw new Error("http");
    return await res.arrayBuffer();
  }
  function trimBlobs() {
    const keep = new Set([TRACKS[cur].id]);
    if (srcId) keep.add(srcId);
    const n = upcoming();
    if (n !== null) keep.add(TRACKS[n].id);
    Object.keys(blobs).forEach((id) => {
      if (!keep.has(id)) { URL.revokeObjectURL(blobs[id]); delete blobs[id]; }
    });
  }
  async function getTrackURL(i) {
    const t = TRACKS[i];
    if (blobs[t.id]) return blobs[t.id];
    const [key, buf] = await Promise.all([getKey(), getEncrypted(t.file)]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
    if (!blobs[t.id]) blobs[t.id] = URL.createObjectURL(new Blob([plain], { type: "audio/mpeg" }));
    return blobs[t.id];
  }
  function errorText(e) {
    if (e && e.message === "nocrypto") return "この画面では再生できません。SafariやChromeで開き直してください";
    if (!navigator.onLine) return "電波がないときは、オフライン保存した曲だけ再生できます";
    return "曲を読み込めませんでした。通信状況を確かめて、ページを開き直してください";
  }

  /* ---------- 再生順 ---------- */
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function rebuildQueue() {
    queue = shuffle ? [cur].concat(shuffled(order.filter((i) => i !== cur))) : order.slice();
    pos = queue.indexOf(cur);
  }
  function upcoming() {
    if (pos < queue.length - 1) return queue[pos + 1];
    if (repeat && !shuffle) return queue[0];
    return null;
  }
  function advance() {
    if (pos < queue.length - 1) return queue[pos + 1];
    if (!repeat) return null;
    if (shuffle) {
      const last = cur;
      queue = shuffled(order);
      if (queue.length > 1 && queue[0] === last) [queue[0], queue[1]] = [queue[1], queue[0]];
    }
    return queue[0];
  }

  async function load(i, autoplay) {
    cur = i;
    pos = queue.indexOf(i);
    if (pos < 0) rebuildQueue();
    const t = TRACKS[i];
    const token = ++loadToken;
    loaded = false;
    wantPlay = !!autoplay;
    const root = document.documentElement;
    root.style.setProperty("--accent-l", t.accentL);
    root.style.setProperty("--accent-d", t.accentD);
    setTitle(t.title);
    $("songArtist").textContent = ARTIST;
    swapArt(t.art);
    renderTanka(t);
    seek.value = 0;
    curEl.textContent = "0:00";
    durEl.textContent = fmt(t.length);
    updateSeek();
    markRows();
    setMediaSession(t);
    if (!audio.paused) audio.pause();
    setStatus(blobs[t.id] ? "" : "読み込み中…");
    try {
      const u = await getTrackURL(i);
      if (token !== loadToken) return;
      audio.src = u;
      srcId = t.id;
      loaded = true;
      setStatus("");
      trimBlobs();
      if (wantPlay) { wantPlay = false; play(); }
    } catch (e) {
      if (token !== loadToken) return;
      setPlayingUI(false);
      setStatus(errorText(e));
    }
  }
  function play() {
    if (!loaded) { wantPlay = true; setStatus("読み込み中…"); return; }
    const p = audio.play();
    if (p && p.catch) {
      p.catch((err) => {
        setPlayingUI(false);
        if (err && err.name === "NotAllowedError") setStatus("再生ボタンを押すと始まります");
      });
    }
  }
  function toggle() { if (audio.paused) play(); else audio.pause(); }
  function next(auto) {
    const playing = auto || !audio.paused || wantPlay;
    const n = advance();
    if (n === null) { load(queue[0], false); return; }
    load(n, playing);
  }
  function prev() {
    if (audio.currentTime > 3 || pos <= 0) { audio.currentTime = 0; return; }
    load(queue[pos - 1], !audio.paused || wantPlay);
  }
  function prefetch() {
    const n = upcoming();
    if (n !== null && !blobs[TRACKS[n].id]) getTrackURL(n).then(trimBlobs).catch(() => {});
  }

  /* ---------- 曲目と並べ替え ---------- */
  function buildList(focusPos) {
    list.textContent = "";
    order.forEach((i, p) => {
      const t = TRACKS[i];
      const li = document.createElement("li");
      li.dataset.track = String(i);
      const row = document.createElement("button");
      row.type = "button";
      row.className = "row";
      const img = document.createElement("img");
      img.src = t.art;
      img.alt = "";
      img.loading = "lazy";
      const mid = document.createElement("span");
      mid.className = "mid";
      const name = document.createElement("span");
      name.className = "t";
      name.textContent = t.title;
      const eq = document.createElement("span");
      eq.className = "eq";
      eq.setAttribute("aria-hidden", "true");
      eq.innerHTML = "<i></i><i></i><i></i>";
      mid.append(name, eq);
      const d = document.createElement("span");
      d.className = "d";
      d.innerHTML = '<svg viewBox="0 0 24 24" aria-label="オフライン保存済み"><path d="M5 18h14v2H5v-2zm4.6-2.7L5 10.7l2-1.9 2.6 2.6L17 4l2 2-9.4 9.3z"/></svg>';
      d.append(fmt(t.length));
      row.append(img, mid, d);
      row.addEventListener("click", () => {
        if (editing) return;
        if (i === cur) { toggle(); return; }
        if (shuffle) { cur = i; rebuildQueue(); }
        load(i, true);
      });
      const handle = document.createElement("button");
      handle.type = "button";
      handle.className = "handle";
      handle.setAttribute("aria-label", "「" + t.title + "」を並べ替え（上下キーで移動）");
      handle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16v2H4zM4 13h16v2H4z"/></svg>';
      handle.addEventListener("pointerdown", (e) => startDrag(e, li, p));
      handle.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp" && p > 0) { e.preventDefault(); moveTrack(p, p - 1, true); }
        if (e.key === "ArrowDown" && p < order.length - 1) { e.preventDefault(); moveTrack(p, p + 1, true); }
      });
      li.append(row, handle);
      list.appendChild(li);
    });
    markRows();
    if (typeof focusPos === "number" && list.children[focusPos]) list.children[focusPos].querySelector(".handle").focus();
  }
  function markRows() {
    Array.from(list.children).forEach((li) => {
      const i = Number(li.dataset.track);
      li.querySelector(".row").setAttribute("aria-current", i === cur ? "true" : "false");
      li.classList.toggle("is-saved", saved.has(TRACKS[i].id));
    });
  }
  function moveTrack(from, to, keepFocus) {
    const [m] = order.splice(from, 1);
    order.splice(to, 0, m);
    saveState();
    if (!shuffle) { queue = order.slice(); pos = queue.indexOf(cur); }
    buildList(keepFocus ? to : undefined);
    prefetch();
  }
  function startDrag(e, li, from) {
    if (!editing) return;
    e.preventDefault();
    const handle = e.currentTarget;
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    const items = Array.from(list.children);
    const h = li.getBoundingClientRect().height;
    const startY = e.clientY;
    let to = from;
    li.classList.add("lift");
    const move = (ev) => {
      const dy = ev.clientY - startY;
      li.style.transform = "translateY(" + dy + "px)";
      to = Math.max(0, Math.min(items.length - 1, from + Math.round(dy / h)));
      items.forEach((el, j) => {
        if (el === li) return;
        let s = 0;
        if (from < to && j > from && j <= to) s = -h;
        else if (from > to && j < from && j >= to) s = h;
        el.style.transform = s ? "translateY(" + s + "px)" : "";
      });
    };
    const end = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", end);
      handle.removeEventListener("pointercancel", end);
      items.forEach((el) => { el.style.transform = ""; });
      li.classList.remove("lift");
      if (to !== from) moveTrack(from, to, false);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  }
  function setSummary() {
    const total = Math.floor(TRACKS.reduce((a, t) => a + t.length, 0));
    const sum = $("sum");
    sum.textContent = "";
    const a = document.createElement("span"); a.textContent = "全" + TRACKS.length + "曲";
    const b = document.createElement("span"); b.textContent = Math.floor(total / 60) + "分" + (total % 60) + "秒";
    sum.append(a, b);
  }

  /* ---------- オフライン保存 ---------- */
  async function refreshSaved() {
    saved = new Set();
    if ("caches" in window) {
      try {
        const c = await caches.open(SONG_CACHE);
        for (const t of TRACKS) { if (await c.match(t.file)) saved.add(t.id); }
      } catch (e) {}
    }
    markRows();
    saveUI();
  }
  function saveUI() {
    if (!("caches" in window)) { $("offline").hidden = true; return; }
    const all = saved.size === TRACKS.length;
    if (!saving) {
      saveBtn.dataset.state = all ? "done" : "idle";
      saveLabel.textContent = all ? "オフライン保存済み" : (saved.size ? "残りの曲もオフライン保存" : "オフライン保存");
      $("icSave").style.display = all ? "none" : "";
      $("icDone").style.display = all ? "" : "none";
    }
    unsaveBtn.hidden = saved.size === 0 || saving;
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    $("hint").hidden = standalone || !("serviceWorker" in navigator);
  }
  async function saveAll() {
    if (saving || saved.size === TRACKS.length) return;
    saving = true;
    saveBtn.disabled = true;
    unsaveBtn.hidden = true;
    const need = TRACKS.filter((t) => !saved.has(t.id));
    try {
      const c = await caches.open(SONG_CACHE);
      for (let k = 0; k < need.length; k++) {
        saveLabel.textContent = "保存中… " + (k + 1) + "/" + need.length;
        await c.add(need[k].file);
        saved.add(need[k].id);
        markRows();
      }
      await c.addAll(TRACKS.map((t) => t.art)).catch(() => {});
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      setStatus("");
    } catch (e) {
      setStatus("保存できませんでした。通信状況と空き容量を確かめてください");
    }
    saving = false;
    saveBtn.disabled = false;
    saveUI();
  }
  async function removeAll() {
    if (!window.confirm("オフライン保存した曲を削除しますか？")) return;
    try { await caches.delete(SONG_CACHE); } catch (e) {}
    refreshSaved();
  }

  /* ---------- 操作 ---------- */
  playBtn.addEventListener("click", toggle);
  $("prev").addEventListener("click", prev);
  $("next").addEventListener("click", () => next(false));
  shuffleBtn.addEventListener("click", () => {
    shuffle = !shuffle;
    rebuildQueue();
    setModeButtons();
    saveState();
    trimBlobs();
    prefetch();
  });
  repeatBtn.addEventListener("click", () => {
    repeat = !repeat;
    setModeButtons();
    saveState();
    prefetch();
  });
  editBtn.addEventListener("click", () => {
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    editBtn.setAttribute("aria-pressed", String(editing));
    editBtn.textContent = editing ? "完了" : "並べ替え";
  });
  saveBtn.addEventListener("click", saveAll);
  unsaveBtn.addEventListener("click", removeAll);

  seek.addEventListener("input", () => {
    seeking = true;
    const d = isFinite(audio.duration) ? audio.duration : TRACKS[cur].length;
    curEl.textContent = fmt(seek.value / 1000 * d);
    seek.style.setProperty("--p", (seek.value / 10) + "%");
  });
  seek.addEventListener("change", () => {
    const d = audio.duration;
    if (isFinite(d) && d > 0) audio.currentTime = seek.value / 1000 * d;
    seeking = false;
  });

  audio.addEventListener("timeupdate", updateSeek);
  audio.addEventListener("loadedmetadata", () => { if (isFinite(audio.duration)) durEl.textContent = fmt(audio.duration); });
  audio.addEventListener("play", () => setPlayingUI(true));
  audio.addEventListener("pause", () => setPlayingUI(false));
  audio.addEventListener("waiting", () => setStatus("読み込み中…"));
  audio.addEventListener("playing", () => { setStatus(""); prefetch(); });
  audio.addEventListener("ended", () => next(true));
  audio.addEventListener("error", () => {
    if (!loaded || audio.src !== blobs[TRACKS[cur].id]) return;
    setPlayingUI(false);
    setStatus(errorText());
  });

  if ("mediaSession" in navigator) {
    const ms = navigator.mediaSession;
    try {
      ms.setActionHandler("play", play);
      ms.setActionHandler("pause", () => audio.pause());
      ms.setActionHandler("previoustrack", prev);
      ms.setActionHandler("nexttrack", () => next(false));
      ms.setActionHandler("seekto", (e) => { if (e && typeof e.seekTime === "number") audio.currentTime = e.seekTime; });
    } catch (e) {}
  }

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  /* ---------- 開始 ---------- */
  loadState();
  setModeButtons();
  setSummary();
  cur = order[0];
  rebuildQueue();
  buildList();
  const first = TRACKS[cur];
  artFront.src = first.art;
  artFront.classList.add("on");
  ambFront.style.backgroundImage = 'url("' + first.art + '")';
  ambFront.classList.add("on");
  load(cur, false);
  refreshSaved();
})();
</script>
</body>
</html>
